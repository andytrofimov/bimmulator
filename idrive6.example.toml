# Copy to idrive6.toml and edit psdzdata to your extracted PSdZData directory.
psdzdata = "/path/to/psdzdata"

# Select the ECUs to start. The 6WB opens both the cluster and HUD.
modules = ["head-unit", "6wb"]

# Optional. Defaults to $XDG_CACHE_HOME/idrive6 or ~/.cache/idrive6.
# cacheDir = "/path/to/idrive6-cache"

# Optional: cocoa on macOS (default), gtk on Linux (default), or none on either.
# The 6WB uses SDL windows whenever the display is not none.
# display = "none"

# Optional: 2 (default) or 1 for the slower single-core compatibility mode.
# cpuCount = 2

# Optional: integrate the head unit and optional 6WB in a local browser session.
# Requires head-unit in modules; overrides native windows. No runtime downloads.
# web = true
# webPort = 8090

# Advanced, explicit operator-prepared NBT inputs (NOT package-verified).
# Both external paths are required together; source-pinned overlays still apply.
# In this mode psdzdata is used only for 6wb and may be omitted for head-unit only.
# preparedRoot = "/external/prepared-root"
# bootImage = "/external/boot1.ifs"
